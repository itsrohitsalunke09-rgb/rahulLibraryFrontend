<section class="my-books-page">
  <header class="page-header">
    <div class="dashboard-title">
      <h3>My Books</h3>
    </div>
  </header>

  <p-toast position="top-right"></p-toast>

  <p-card styleClass="my-books-table-card">
    <p-table
      #dt
      [value]="issues"
      [paginator]="true"
      [rows]="10"
      [totalRecords]="totalElements"
      [rowsPerPageOptions]="[5, 10, 25]"
      [lazy]="true"
      (onLazyLoad)="onPageChange($event)"
      [tableStyle]="{ 'min-width': '100%' }"
      styleClass="p-datatable-sm responsive-table"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [rowHover]="true"
      [loading]="loading">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="bookTitle">Book </th>
          <th pSortableColumn="issueDate">Issued </th>
          <th pSortableColumn="dueDate">Due </th>
          <th pSortableColumn="status">Status </th>
          <th style="width: 60px;">Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-issue>
        <tr>
          <td class="book-cell">
            <div class="cell-content">
              <span class="cell-value" [class.marathi]="issue.category === 'Marathi Literature'">{{ issue.bookTitle }}</span>
            </div>
          </td>
          <td class="date-cell">
            <div class="cell-content">
              <span class="cell-value">{{ issue.issueDate }}</span>
            </div>
          </td>
          <td class="date-cell">
            <div class="cell-content">
              <span class="cell-value" [class.overdue]="isOverdue(issue)">{{ issue.dueDate }}</span>
            </div>
          </td>
          <td class="status-cell">
            <span class="badge" [ngClass]="badge(issue.status)">{{ issue.status }}</span>
          </td>
          <td class="action-cell">
            <div class="action-icons">
              <button class="action-btn return-btn" *ngIf="issue.status !== 'RETURNED'" (click)="confirmReturn(issue)" pTooltip="Return the book" aria-label="Return book">
                <i class="pi pi-undo"></i>
              </button>
              <span class="return-date" *ngIf="issue.status === 'RETURNED'">{{ issue.returnDate }}</span>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty-state">
            <div class="empty-content">
              <i class="pi pi-book"></i>
              <p>No books issued yet.</p>
              <p class="hint">Browse the catalog and ask the librarian to issue a book.</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <p-confirmDialog>
    <ng-template pTemplate="message" let-message>
      <div class="confirm-dialog-content">
        <i class="pi pi-exclamation-circle"></i>
        <p>{{ message.message }}</p>
      </div>
    </ng-template>
  </p-confirmDialog>
</section>
