<div class="library-3d-page">

  <section class="digital-book-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="book-header">

      <button
        type="button"
        class="back-button"
        (click)="goBack()"
        aria-label="Back to Login">

        <i class="pi pi-arrow-left"></i>

        <span>Back to Login</span>

      </button>


      <div class="book-title">

        <h1>राहुल सार्वजनिक वाचनालय</h1>

        <p>वाचनालयाची माहिती व इतिहास</p>

      </div>

    </header>


    <!-- =========================
         BOOK CONTENT
    ========================== -->

    <main class="book-area">



      <!-- =========================
           3D BOOK
      ========================== -->

      <div class="book-wrapper">


        <!-- Previous -->

        <button
          type="button"
          class="navigation-button previous"
          (click)="previousPage()"
          aria-label="Previous page">

          <i class="pi pi-chevron-left"></i>

        </button>


        <!--
          IMPORTANT:
          The TypeScript @ViewChild('bookContainer')
          connects to this element.
        -->

        <div
          #bookContainer
          class="book-container">
        </div>


        <!-- Next -->

        <button
          type="button"
          class="navigation-button next"
          (click)="nextPage()"
          aria-label="Next page">

          <i class="pi pi-chevron-right"></i>

        </button>

      </div>


      <!-- =========================
           PAGE CONTROLS
      ========================== -->

      <div class="book-controls">





        <div class="page-counter">

          Page {{ currentPage }} / {{ totalPages }}

        </div>


      </div>


      <!-- =========================
           USER INSTRUCTION
      ========================== -->

      <p class="book-hint">

        <i class="pi pi-info-circle"></i>

        Drag the page corner or swipe to turn the page

      </p>


    </main>

  </section>

</div>
