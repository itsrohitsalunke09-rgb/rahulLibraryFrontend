<div class="library-3d-page">

  <section class="digital-book-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="book-header">

      <button
        type="button"
        class="back-button"
        (click)="goBack()"
        aria-label="Back to Login">

        <i class="pi pi-arrow-left"></i>

        <span>Back to Login</span>

      </button>


      <div class="book-title">

        <h1>राहुल सार्वजनिक वाचनालय</h1>

        <p>वाचनालयाची माहिती व इतिहास</p>

      </div>

    </header>


    <!-- =========================
         BOOK CONTENT
    ========================== -->

    <main class="book-area">

      <!-- Small introduction -->

      <div class="book-intro">

      <span class="book-icon">

        <i class="pi pi-book"></i>

      </span>


        <div>

          <h2>Library Digital Book</h2>

          <p>
            Explore the history and journey of
            Rahul Public Library.
          </p>

        </div>

      </div>


      <!-- =========================
           3D BOOK
      ========================== -->

      <div class="book-wrapper">


        <!-- Previous -->

        <button
          type="button"
          class="navigation-button previous"
          (click)="previousPage()"
          aria-label="Previous page">

          <i class="pi pi-chevron-left"></i>

        </button>


        <!--
          IMPORTANT:
          The TypeScript @ViewChild('bookContainer')
          connects to this element.
        -->

        <div
          #bookContainer
          class="book-container">
        </div>


        <!-- Next -->

        <button
          type="button"
          class="navigation-button next"
          (click)="nextPage()"
          aria-label="Next page">

          <i class="pi pi-chevron-right"></i>

        </button>

      </div>


      <!-- =========================
           PAGE CONTROLS
      ========================== -->

      <div class="book-controls">


        <button
          type="button"
          class="control-button"
          (click)="previousPage()">

          <i class="pi pi-angle-left"></i>

          <span>Previous</span>

        </button>


        <div class="page-counter">

          Page {{ currentPage }} / {{ totalPages }}

        </div>


        <button
          type="button"
          class="control-button"
          (click)="nextPage()">

          <span>Next</span>

          <i class="pi pi-angle-right"></i>

        </button>


      </div>


      <!-- =========================
           USER INSTRUCTION
      ========================== -->

      <p class="book-hint">

        <i class="pi pi-info-circle"></i>

        Drag the page corner or swipe to turn the page

      </p>


    </main>

  </section>



      <!-- Navigation -->
      <div class="actions">
        <button class="btn btn-primary" (click)="goToLogin()">
          <i class="pi pi-sign-in"></i>
          <span>Go to Login</span>
        </button>
        <button class="btn btn-secondary" (click)="goToRegister()">
          <i class="pi pi-user-plus"></i>
          <span>Register as Student</span>
        </button>
      </div>
</div>
