  <div class="panel card">
<!--    <p class="kicker">NGO community library</p>-->
    <h1>राहुल सार्वजनिक वाचनालय </h1>
    <form (ngSubmit)="submit()">
      <label class="field">
        <span>Username</span>
        <input name="username" [(ngModel)]="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <div class="password-field">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" (click)="toggleShowPassword()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>
      <p class="error" *ngIf="error">{{ error }}</p>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Logging in…' : 'Log in' }}</button>
    </form>

    <p class="register-link">
      Don't have an account? <a routerLink="/register">Register as Student</a>
    </p>
